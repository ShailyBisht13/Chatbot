services:
  # 1. Python FastAPI AI Engine
  - type: web
    name: deepshiva-ai-engine
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false

  # 2. Node.js Express Backend
  - type: web
    name: deepshiva-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: deepshiva-ai-engine
          property: host
